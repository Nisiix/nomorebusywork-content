name: Publish Instagram queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["queue/**/post.json"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/publish.py
      - name: Record results
        if: always()
        run: |
          git config user.name "nmb-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue
          if ! git diff --cached --quiet; then
            git commit -m "Record publishing results"
            git push
          fi
